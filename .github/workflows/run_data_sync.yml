name: Sync Strava and push

on:
  workflow_dispatch:
    inputs:
      history_limit:
        description: Older activities per batch (0 skips history)
        type: number
        default: 50
  schedule:
    - cron: '17 */6 * * *' # Beijing time 02:17, 08:17, 14:17, 20:17

permissions:
  contents: write

concurrency:
  group: strava-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: vars.ENABLE_STRAVA_SYNC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync recent activities and one historical batch
        id: sync
        continue-on-error: true
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CLIENT_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
          STRAVA_ATHLETE_ID: ${{ secrets.STRAVA_ATHLETE_ID }}
          HISTORY_LIMIT: ${{ github.event.inputs.history_limit || '50' }}
          PYTHONUNBUFFERED: '1'
        run: python run_page/strava_auto_sync.py --history-limit "$HISTORY_LIMIT" --detail-limit 5 --weather-limit 5

      - name: Commit and push saved progress
        if: always() && steps.sync.outcome != 'skipped' && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/static/activities.json public/data/activity-timelines public/data/pace-preview.json
          if [ -f .strava-sync/state.json ]; then
            git add -- .strava-sync/state.json
          fi
          if git diff --cached --quiet; then
            echo "No activity changes to push."
            exit 0
          fi
          git commit -m "Sync Strava activities [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Write sync summary
        if: always() && steps.sync.outcome != 'skipped'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          activities = json.loads(Path('src/static/activities.json').read_text())
          path = Path('.strava-sync/state.json')
          state = json.loads(path.read_text()) if path.exists() else {}
          dates = sorted(a['start_date_local'] for a in activities)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Saved activities: **{len(activities)}**\n\n")
              if dates:
                  out.write(f"Range: {dates[0][:10]} to {dates[-1][:10]}\n\n")
              out.write(f"Historical backfill complete: {state.get('history_complete', False)}\n")
          PY

      - name: Report incomplete sync
        if: always() && steps.sync.outcome == 'failure'
        run: |
          echo "Saved progress was pushed; the next scheduled batch will retry."
          exit 1
